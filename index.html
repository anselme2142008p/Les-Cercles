app.innerHTML=h+bar(S.k/S.pl.length*100,"Question "+(S.k+1)+" sur "+S.pl.length)+talk("neutral","Réfléchis bien…")+'<p class="q">'+T(B[e.q].f)+'</p>'+[0,1].map(function(k){return opt(e.q,e.o[k],"pickPlay("+k+",this)",k*90)}).join("");return}
if(S.mode==="result"){var sc=S.res.filter(Boolean).length,tot=S.res.length,r=sc/tot,
t=r>=.9?"Un vrai proche.":r>=.7?"Tu le connais bien.":r>=.5?"Pas mal, mais peut mieux faire.":"Faux ami détecté.",
rm="Salut "+S.name+" ! C’est "+(S.name2||"un ami")+" : j’ai eu "+sc+"/"+tot+" à ton quiz Le Cercle ✨";var wl="https://wa.me/"+(S.wa||"")+"?text="+encodeURIComponent(rm);
app.innerHTML=h+scene(r>=.5?"happy":"sad",r>=.5?"happy":"sad",r>=.7?"Quel duo ! 🎉":"Aïe… 😅",r>=.7?"Tu le connais bien !":"Il faut réviser")+'<div class="center"><div class="step">Ton score</div><div class="score"><span id="sc">0</span>/'+tot+'</div><h2>'+t+'</h2><div class="stars">'+[0,1,2].map(function(i){return '<span style="animation-delay:'+(.5+i*.25)+'s">'+(i<(r>=.9?3:r>=.7?2:r>=.5?1:0)?'⭐':'☆')+'</span>'}).join('')+'</div></div><div class="orn center">✦ ✦ ✦</div><div class="card">'+S.pl.map(function(e,k){return '<div class="row"><span>'+T(B[e.q].f)+'</span><span>'+(S.res[k]?'✓':'✗')+'</span></div>'}).join("")+'</div><a class="btn" target="_blank" rel="noopener" href="'+wl+'">Envoyer ma note à '+esc(S.name)+' sur WhatsApp</a><button class="btn alt" onclick="location.hash=\'\';S.mode=\'home\';draw()">Créer mon propre quiz</button><button class="btn alt" onclick="begin()">Rejouer ↻</button>'+(r>=.7?'<button class="btn alt" onclick="playHappy()">🔊 Réécouter le son</button>':'')+'';
count(sc);if(r>=.7){confetti();playHappy()}}}
function count(v){var el=document.getElementById("sc"),t0=null;function f(t){if(!t0)t0=t;var p=Math.min((t-t0)/900,1);el.textContent=Math.round(v*p);if(p<1)requestAnimationFrame(f)}requestAnimationFrame(f)}
function confetti(){var c=["#d6b268","#b8923a","#f3ecdc","#9a7424"];for(var j=0;j<36;j++){var d=document.createElement("i");d.className="conf";d.style.cssText="left:"+Math.random()*100+"vw;background:"+c[j%4]+";animation-delay:"+Math.random()*1.2+"s;animation-duration:"+(2+Math.random()*2)+"s";document.body.appendChild(d);setTimeout(function(x){x.remove()},5500,d)}}
function start(){var v=document.getElementById("nm").value.trim(),w=document.getElementById("wa").value.replace(/\D/g,"").replace(/^00/,""),er=document.getElementById("er");
if(!v){er.textContent="Entre ton prénom.";document.getElementById("nm").focus();return}
if(w.length<9||w.length>15){er.textContent="Entre ton numéro WhatsApp complet, avec l’indicatif de ton pays (ex. : +229 nn nn nn nn).";document.getElementById("wa").focus();return}
S.name=v.slice(0,30);S.wa=w;S.mode="make";S.i=0;S.mine=[];draw()}
function pickMake(k,el){if(S.lock)return;S.lock=true;el.classList.add("sel");S.mine.push([S.i,k]);setTimeout(adv,380,true)}
function adv(){S.lock=false;S.i++;if(S.mine.length>=N||S.i>=B.length){S.mode="done"}draw()}
function sh(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
function mix(n){var p,ok,o=Math.random()<.5?0:1;do{p=[];for(var i=0;i<n;i++)p.push((i+o)%2);sh(p);ok=true;for(i=3;i<n;i++)if(p[i]===p[i-1]&&p[i]===p[i-2]&&p[i]===p[i-3])ok=false}while(!ok);return p}
function begin(){var n2=document.getElementById("nm2");if(n2){var v=n2.value.trim();if(!v){n2.focus();return}S.name2=v.slice(0,30)}var pos=mix(S.mine.length);
S.pl=sh(S.mine.slice()).map(function(m,i){var q=m[0],c=m[1],r;do{r=Math.floor(Math.random()*B[q].o.length)}while(r===c);
var two=pos[i]?[r,c]:[c,r];return{q:q,o:two,g:pos[i]?1:0}});S.k=0;S.st=0;S.res=[];S.mode="play";draw()}
function pickPlay(k,el){if(S.lock)return;S.lock=true;var e=S.pl[S.k],ok=k===e.g;S.res.push(ok);el.classList.add(ok?"ok":"ko");S.st=ok?(S.st||0)+1:0;if(ok)el.insertAdjacentHTML("beforeend",'<i class="plus">+1</i>');say(ok?"happy":"sad",ok?(S.st>=3?"🔥 "+S.st+" d’affilée !":"Bien joué ! 🎉"):"Raté… 😬");
if(!ok)app.querySelectorAll(".opt")[e.g].classList.add("ok");
setTimeout(function(){S.lock=false;S.k++;if(S.k>=S.pl.length)S.mode="result";draw()},850)}
function copy(){var b=document.getElementById("cp");try{navigator.clipboard.writeText(S.link).then(function(){b.textContent="Lien copié ✓"},sel)}catch(e){sel()}}
function sel(){var r=document.createRange();r.selectNodeContents(document.getElementById("lk"));var s=getSelection();s.removeAllRanges();s.addRange(r)}
window.addEventListener("hashchange",function(){if(location.hash.length>1)init()});
function init(){var h=location.hash.slice(1),o=h&&dec(h);if(o){S.name=o.n;S.mine=o.a;S.wa=o.w;S.mode="name"}else S.mode="home";draw()}
(function(){var d=document.createElement("div"),h="",i,y=["✦","✧","✨","♡","✦","✧"];d.id="sky";
for(i=0;i<3;i++)h+='<i class="cl" style="top:'+(8+i*32)+'%;width:'+(150+i*60)+'px;animation-duration:'+(55+i*20)+'s;animation-delay:-'+(i*22)+'s"></i>';
for(i=0;i<18;i++)h+='<span class="st" style="left:'+(Math.random()*96)+'%;top:'+(Math.random()*94)+'%;font-size:'+(10+Math.random()*16)+'px;animation-duration:'+(2+Math.random()*3)+'s,'+(6+Math.random()*6)+'s;animation-delay:'+(Math.random()*3)+'s">'+y[i%6]+'</span>';
d.innerHTML=h;document.body.insertBefore(d,document.body.firstChild)})();
(function(){if(matchMedia("(prefers-reduced-motion:reduce)").matches)return;
var d=document.createElement("div"),sp="",i,a;d.id="splash";
for(i=0;i<14;i++){a=i/14*6.283;sp+='<i class="sp-sp" style="--dx:'+Math.round(Math.cos(a)*118)+'px;--dy:'+Math.round(Math.sin(a)*118)+'px;--d:'+(.55+i*.04)+'s">'+(i%3?"✦":"✧")+'</i>'}
var t="LE CERCLE".split("").map(function(c,j){return '<span style="animation-delay:'+(.95+j*.07)+'s">'+(c===" "?"\u00a0":c)+'</span>'}).join("");
d.innerHTML='<div class="sp-stage"><svg class="rg" viewBox="0 0 160 160"><circle cx="80" cy="80" r="70"/></svg><svg class="rg2" viewBox="0 0 160 160"><circle cx="80" cy="80" r="76"/></svg>'+sp+'<div class="sp-m">'+m("a","happy")+m("b","happy")+'</div></div><div class="sp-t">'+t+'</div><div class="sp-s">Qui te connaît vraiment ?</div><div class="sp-b"><i></i></div>';
document.body.appendChild(d);
function end(){if(d.className==="out")return;d.className="out";setTimeout(function(){d.remove()},700)}
d.onclick=end;setTimeout(end,3100)})();
init();
</script>
